name: Release

# Publishes to PyPI with Trusted Publishing (no API token): push a tag such as v0.1.0.
# One-time setup on pypi.org: Account -> Publishing -> Add a pending publisher with
#   PyPI project name: schema-compat, owner: cliwireee, repository: schema-compat,
#   workflow: release.yml, environment: pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/schema_compat/__init__.py').read_text()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pip install -e ".[dev,crosscheck]"
      - run: pytest -q
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # npm: Trusted Publishing (OIDC) with provenance. One-time setup on npmjs.com, after the
  # package exists: package settings -> Trusted publishing -> GitHub Actions with
  #   owner: cliwireee, repository: schema-compat, workflow: release.yml, environment: npm
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Tag must match the npm version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm publish --provenance --access public
