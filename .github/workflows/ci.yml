name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # crosscheck installs google-genai and openai-agents, the providers' own SDK code
      # that the repaired schemas are validated against.
      - run: pip install -e ".[dev,crosscheck]"
      - run: pytest --cov=schema_compat --cov-report=term-missing
      - name: Parity corpus is up to date
        if: matrix.python-version == '3.13'
        run: |
          python tests/parity/generate.py
          git diff --exit-code -- tests/parity/corpus.json.gz

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,crosscheck]"
      - run: pytest tests/test_fuzz.py -q
        env:
          SCHEMA_COMPAT_FUZZ: "10000"

  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx attw --pack .
      - run: npx publint
      - name: Smoke-test the packed package
        run: |
          npm pack
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/js/schema-compat-*.tgz
          node -e "const s = require('schema-compat'); if (s.transformSchema({}, 'openai').schema.type !== 'object') process.exit(1)"
          node --input-type=module -e "import { TARGETS } from 'schema-compat'; if (TARGETS.length !== 5) process.exit(1)"
          npx schema-compat --version

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          /tmp/wheel/bin/schema-compat --version
          echo '{"type": "object", "properties": {"n": {"const": 1}}}' | /tmp/wheel/bin/schema-compat check - -t gemini || test $? -eq 1
